---
- name: Assume an AWS IAM role and run tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    session_name: "AnsibleSession"
  
  tasks:
  - name: Assume the target IAM role
    amazon.aws.sts_assume_role:
      role_arn: "{{ target_role_arn }}"
      role_session_name: "{{ session_name }}"
    register: assumed_role_creds

  - name: Display credentials
    ansible.builtin.debug:
      var: assumed_role_creds
   
 
  - name: Exportar credenciais para o próximo Job do Workflow
    ansible.builtin.set_stats:
      data:
        wf_access_key: "{{ assumed_role_creds.sts_creds.access_key }}"
        wf_secret_key: "{{ assumed_role_creds.sts_creds.secret_key }}"
        wf_session_token: "{{ assumed_role_creds.sts_creds.session_token }}"