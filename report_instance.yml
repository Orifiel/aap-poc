---
- name: RAIO-X DO EXECUTION ENVIRONMENT
  hosts: all
  gather_facts: yes
  become: false
    
  tasks:
    - name: Garantir que o gestor de pacotes pip está instalado (Amazon Linux)
      ansible.builtin.debug:
        var: "{{ ansible_facts['fqdn']}}"

    - name: upgrade all packages
      ansible.builtin.dnf: 
        name: "*"
        update_only: yes
        allow_downgrade: true
        state: latest  

    - name: Verificação de reboot necessária
      ansible.builtin.command: needs-restarting -r
      changed_when: false
      failed_when: false
      register: reboot_hint

    - name: Rebooting...
      ansible.builtin.reboot:
        msg: "Reboot required for updated kernel"
      when: reboot_hint.rc == 1
