---
- name: RAIO-X DO EXECUTION ENVIRONMENT
  hosts: all
  gather_facts: yes
  tasks:
    - name: 1. Qual Python o Ansible está usando?
      ansible.builtin.debug:
        msg: "Python Executável: {{ ansible_playbook_python }}"

    - name: 2. Listar collections instaladas no container
      ansible.builtin.shell: ansible-galaxy collection list | grep amazon
      register: galaxy_list
      changed_when: false

    - name: 3. Mostrar collections da AWS
      ansible.builtin.debug:
        var: galaxy_list.stdout_lines

    - name: 4. Testar se o Python do Ansible enxerga o Boto3
      ansible.builtin.shell: "{{ ansible_playbook_python }} -c 'import boto3; print(boto3.__file__)'"
      register: boto3_check
      ignore_errors: true
      changed_when: false

    - name: 5. Resultado do Boto3
      ansible.builtin.debug:
        msg: 
          - "Status: {{ 'ENCONTRADO' if boto3_check.rc == 0 else 'FALHOU' }}"
          - "Detalhes: {{ boto3_check.stdout if boto3_check.rc == 0 else boto3_check.stderr }}"
   
  tasks:
    - name: Coletar quantidade de pacotes instalados (RedHat/Amazon Linux)
      ansible.builtin.shell: "rpm -qa | wc -l"
      register: rpm_count
      changed_when: false

    - name: Exibir Relatório da Instância
      ansible.builtin.debug:
        msg:
          - "--------------------------------------------------"
          - "RELATÓRIO DE SAÚDE DA INSTÂNCIA"
          - "--------------------------------------------------"
          - "Nome da Máquina (Hostname): {{ ansible_hostname }}"
          - "Sistema Operacional:        {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Arquitetura:                {{ ansible_architecture }}"
          - "--------------------------------------------------"
          - "DISCO (Raiz /):"
          - "  - Total:      {{ root_mount.size_total | human_readable }}"
          - "  - Disponível: {{ root_mount.size_available | human_readable }}"
          - "--------------------------------------------------"
          - "MEMÓRIA RAM:"
          - "  - Total:      {{ ansible_memtotal_mb }} MB"
          - "  - Livre:      {{ ansible_memfree_mb }} MB"
          - "--------------------------------------------------"
          - "SOFTWARES:"
          - "  - Pacotes Instalados: {{ rpm_count.stdout if ansible_os_family == 'RedHat' else (dpkg_count.stdout if ansible_os_family == 'Debian' else 'N/A') }}"
          - "--------------------------------------------------"