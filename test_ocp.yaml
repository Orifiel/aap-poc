---
- name: Get pods
  hosts: all
  connection: local
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks: 
    - name: teste2
      debug:
        msg: "{{hostvars[item].environment['K8S_AUTH_HOST']}}"
      loop: 
        - "{{ inventory_hostname }}"
        
    - name: Define credentials
      set_fact:
        api_url: "{{hostvars[item].environment['K8S_AUTH_HOST']}}"
      loop: 
        - "{{ inventory_hostname }}"

    - name: Get pods
      kubernetes.core.k8s_info:
        host: "{{ api_url }}"
        api_key: "{{ K8S_AUTH_API_KEY }}"
        validate_certs: false
        kind: Pod
      register: pod_list
    
    - name: Show the pods
      ansible.builtin.debug:
        var: pod_list.stdout_lines
      
        
              
  
