---
- name: Get pods
  hosts: all
  connection: local
  tasks:
    - name: Get a list of all pods from any namespace
      kubernetes.core.k8s_info:
        host: "{{ K8S_AUTH_HOST }}"
        api_key: "{{ K8S_AUTH_API_KEY }}"
        validate_certs: "{{ K8S_AUTH_VERIFY_SSL }}"
        kind: Pod
      register: pod_list

    - name: Show me the pods
      ansible.builtin.debug:
        var: pod_list