---
- name: Get pods
  hosts: all
  connection: local
  tasks:
    - name: Get a list of all pods from any namespace
      kubernetes.core.k8s_info:
        host: "{{ acm_api_host }}"
        api_key: "{{ acm_api_token }}"
        validate_certs: "{{ acm_validate_certs }}"
        kind: Pod
      register: pod_list

    - name: Show me the pods
      ansible.builtin.debug:
        var: pod_list