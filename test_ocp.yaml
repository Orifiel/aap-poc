---
- name: Get pods
  hosts: all
  vars:
    url_api: "{{ lookup('env', 'K8S_AUTH_HOST') }}"
    api_token: "{{ lookup('env', 'K8S_AUTH_API_KEY') }}"
  tasks:
    - name: Auth to cluster
      ansible.builtin.commmand: "oc login --token={{ token }} --server={{ url_api }}"

    - name: Get pods
      ansible.builtin.command: "oc get pods"
      register: pod_list
