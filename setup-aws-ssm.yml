---
- name: Configurar AWS IAM para conexao via SSM
  hosts: all
  gather_facts: false

  vars:
    ec2_role_name: "Role-Para-Instancias-SSM"
    ansible_role_name: "teste-profile"
    aws_account_id: "727646502313"
    s3_bucket_name: "cleiton-ssm-bucket"
    myregion: "us-east-2" # Altere para a sua região
    ansible_python_interpreter: /usr/bin/python3
    
  tasks:
    - name: Gather information about all instances
      amazon.aws.ec2_instance_info:
        region: "{{ myregion }}"
      register: ec2_results

    - name: Cria lista de instance_ids
      ansible.builtin.set_fact:
        all_instance_ids: "{{ ec2_results.instances | map(attribute='instance_id') | list }}"


    - name: show instance id
      ansible.builtin.debug:
        var: all_instance_ids
    # ---------------------------------------------------------
    # 1. CRIAÇÃO DO BUCKET S3
    # ---------------------------------------------------------
    - name: Criar o bucket S3
      amazon.aws.s3_bucket:
        name: "{{ s3_bucket_name }}"
        region: "{{ myregion }}"
        state: present
      register: s3_result

    # ---------------------------------------------------------
    # 2. CONFIGURAÇÃO DA ROLE DAS INSTÂNCIAS (SSM)
    # ---------------------------------------------------------
    - name: Criar a Role IAM para as Instancias EC2
      amazon.aws.iam_role:
        name: "{{ ec2_role_name }}"
        assume_role_policy_document: >
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Service": "ec2.amazonaws.com" },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        managed_policies:
          - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"

    - name: Criar o Instance Profile
      amazon.aws.iam_instance_profile:
        name: "{{ ec2_role_name }}"
        role: "{{ ec2_role_name }}"
        state: present

    - name: Vincular o Instance Profile à instância EC2
      amazon.aws.ec2_instance:
        region: "{{ myregion }}"
        instance_ids: "{{ item.instance_id }}"
        image_id: "{{ item.image_id }}"
        iam_instance_profile: "{{ ec2_role_name }}"
        instance_type: "{{ item.instance_type }}"
        state: present
      loop: "{{ ec2_results.instances }}"
      when: ec2_results.instances | length > 0
    # ---------------------------------------------------------
    # 3. ATUALIZAÇÃO DA ROLE DO ANSIBLE (Permissões SSM + S3)
    # ---------------------------------------------------------
    - name: Garantir que a Role do Ansible exista
      amazon.aws.iam_role:
        name: "{{ ansible_role_name }}"
        state: present
        assume_role_policy_document: >
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "AWS": "arn:aws:iam::{{ aws_account_id }}:root"
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }

    - name: Adicionar permissões de SSM e S3 na Role teste-profile
      amazon.aws.iam_policy:
        iam_type: role
        iam_name: "{{ ansible_role_name }}"
        policy_name: "AnsibleExecutionFullPolicy"
        state: present
        policy_json: >
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "ssm:StartSession",
                  "ssm:TerminateSession",
                  "ssm:ResumeSession"
                ],
                "Resource": [
                  "arn:aws:ec2:*:{{ aws_account_id }}:instance/{{ all_instance_ids }}",
                  "arn:aws:ssm:*:*:document/AWS-StartSSHSession"
                ]
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:ListBucket",
                  "s3:GetBucketLocation",
                  "s3:GetObject",
                  "s3:PutObject"
                ],
                "Resource": [
                  "arn:aws:s3:::{{ s3_bucket_name }}",
                  "arn:aws:s3:::{{ s3_bucket_name }}/*"
                ]
              },
              {
                "Effect": "Allow",
                "Action": [ 
                  "ec2:DescribeInstances",
                  "s3:ListAllMyBuckets"
                ],
                "Resource": "*"
              }
            ]
          }

    - name: Resumo Final
      ansible.builtin.debug:
        msg: 
          - "Bucket S3 '{{ s3_bucket_name }}' criado com sucesso."
          - "Instância '{{ all_instance_ids }}' configurada com perfil SSM."
          - "Role '{{ ansible_role_name }}' agora tem permissões de S3 e SSM."