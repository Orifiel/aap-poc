- name: "[SELinux] Set SELinux Context for Apache"
  ansible.builtin.sefcontext:
    target: "{{ default_document_root }}(/.*)?"
    setype: httpd_sys_content_t
    state: absent
  register: sefcontext_result
 

- name: "[SELinux] Apply changes in SELINUX context file (restorecon)"
  ansible.builtin.command:
    cmd: "restorecon -RviF {{ default_document_root }}"
  when: sefcontext_result.changed 
  changed_when: false 


- name: "[SELinux] Remove Apache network connections"
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: absent
    persistent: true
 